<!DOCTYPE html>
<html lang="ru">
<head>
<script>
  (function(){
    var p=new URLSearchParams(location.search);
    document.documentElement.setAttribute('data-theme',p.get('theme')==='dark'?'dark':'light');
  })();

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Дудл Джамп — Petzker Cookware</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --blue:#2E7BEE;--orange:#F0921A;--green:#22C55E;--red:#EF4444;
  --bg:#0d0d1a;--surface:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.12);
  --text:#ECEEF1;--text-muted:rgba(255,255,255,0.5);
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}

.screen{position:fixed;inset:0;display:flex;flex-direction:column}
.screen.hidden{display:none}

/* ── MENU ── */
#menuScreen{
  background:linear-gradient(180deg,#0d1117 0%,#1a2535 50%,#0d3b1e 100%);
  align-items:center;overflow-y:auto;padding:20px 18px 36px;gap:0;
}
.m-hero{text-align:center;padding:16px 0 20px}
.m-title{font-size:30px;font-weight:800;color:#fff;letter-spacing:-1px}
.m-sub{font-size:12px;color:rgba(255,255,255,0.45);margin-top:4px}

.m-player-card{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
}
.m-avatar{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#e74c3c,#c0392b);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
.m-pname{font-size:15px;font-weight:700;color:#fff}
.m-psub{font-size:11px;color:var(--text-muted);margin-top:2px}

.m-stats{width:100%;display:flex;gap:10px;margin-bottom:16px}
.m-stat{
  flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 8px;text-align:center;
}
.m-stat-icon{font-size:18px;margin-bottom:3px}
.m-stat-val{font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.m-stat-lbl{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

.m-play-btn{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#e74c3c 0%,#c0392b 100%);
  color:white;border:none;border-radius:var(--radius);
  font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;
  margin-bottom:18px;
  box-shadow:0 4px 20px rgba(231,76,60,0.4);
  transition:transform .15s,box-shadow .15s;
}
.m-play-btn:active{transform:scale(.97)}

.m-lb{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;
}
.m-lb-title{font-size:13px;font-weight:700;color:rgba(255,255,255,0.8);margin-bottom:12px}
.m-lb-row{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,0.07);font-size:13px;
}
.m-lb-row:last-child{border-bottom:none}
.m-lb-row.me{color:#FFD700}
.m-lb-rank{width:18px;color:rgba(255,255,255,0.35);font-weight:700;font-size:12px}
.m-lb-row.me .m-lb-rank{color:#FFD700}
.m-lb-med{width:18px;text-align:center;font-size:14px}
.m-lb-name{flex:1;color:rgba(255,255,255,0.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-lb-row.me .m-lb-name{color:#FFD700;font-weight:700}
.m-lb-score{font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.m-lb-row.me .m-lb-score{color:#FFD700}
.m-lb-empty{font-size:12px;color:var(--text-muted);padding:4px 0}

.m-zone-badge{
  display:inline-block;font-size:10px;font-weight:700;
  padding:2px 7px;border-radius:20px;margin-left:5px;
  vertical-align:middle;
}

/* ── GAME ── */
#gameScreen{background:#0d0d1a}
#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%}

.g-hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;
  background:rgba(0,0,0,0.4);backdrop-filter:blur(10px);
  z-index:10;
}
.g-score-box{text-align:left}
.g-score-lbl{font-size:10px;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:.08em}
.g-score-val{font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.g-zone-name{
  font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:20px;
  transition:all .5s;
}
.g-best-box{text-align:right}
.g-best-lbl{font-size:10px;color:rgba(255,255,255,0.55)}
.g-best-val{font-size:14px;font-weight:700;color:#FFD700;font-variant-numeric:tabular-nums}

.g-close-btn{
  position:absolute;top:50%;right:16px;transform:translateY(-50%);
  width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.1);color:#fff;font-size:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;z-index:11;
}

/* touch zones */
.g-touch{
  position:absolute;bottom:0;left:0;right:0;height:45%;
  display:flex;z-index:5;
}
.g-touch-half{flex:1;pointer-events:auto;opacity:0}
.g-touch-hint{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  font-size:11px;color:rgba(255,255,255,0.3);
  pointer-events:none;z-index:6;white-space:nowrap;
  animation:fadeHint 3s forwards;
}
@keyframes fadeHint{0%{opacity:1}70%{opacity:.8}100%{opacity:0}}

/* ── MODAL ── */
.d-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);
  z-index:200;display:none;align-items:center;justify-content:center;
  padding:24px;opacity:0;transition:opacity .2s;
}
.d-overlay.open{display:flex;opacity:1}
.d-modal{
  background:#1a2030;border:1px solid rgba(255,255,255,0.12);
  border-radius:var(--radius);padding:28px 22px;
  text-align:center;max-width:310px;width:100%;
  animation:modalPop .3s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes modalPop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.d-modal-emoji{font-size:44px;margin-bottom:8px}
.d-modal-title{font-size:20px;font-weight:800;color:#fff;margin-bottom:10px}
.d-modal-row{font-size:13px;color:rgba(255,255,255,0.55);margin-bottom:3px}
.d-modal-row b{color:#fff;font-size:18px}
.d-modal-best{font-size:13px;color:#FFD700;font-weight:600;margin-bottom:4px;min-height:18px}
.d-modal-zone{font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:20px}
.d-modal-btns{display:flex;gap:10px}
.d-modal-btn{
  flex:1;padding:13px;background:#e74c3c;color:white;border:none;
  border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;
  font-weight:700;font-size:14px;transition:transform .15s;
}
.d-modal-btn:active{transform:scale(.97)}
.d-modal-btn.secondary{
  background:rgba(255,255,255,0.08);color:#fff;
  border:1px solid rgba(255,255,255,0.15);
}

/* ── TOAST ── */
.d-toast{
  position:fixed;bottom:22px;left:50%;
  transform:translateX(-50%) translateY(16px) scale(.9);
  background:#1a1d23;color:#fff;
  padding:10px 20px;border-radius:30px;
  font-size:13px;font-weight:600;
  opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index:300;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center;
}
.d-toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
</style>
</head>
<body>

<!-- ═══ MENU ═══ -->
<div class="screen" id="menuScreen">
  <div class="m-hero">
    <div class="m-title">🏮 Дудл Джамп</div>
    <div class="m-sub">С рисовых полей — до космоса!</div>
  </div>

  <div class="m-player-card">
    <div class="m-avatar" id="mAvatar">👤</div>
    <div>
      <div class="m-pname" id="mName">Загрузка…</div>
      <div class="m-psub" id="mSub">Авторизация через Telegram</div>
    </div>
  </div>

  <div class="m-stats">
    <div class="m-stat">
      <div class="m-stat-icon">🏆</div>
      <div class="m-stat-val" id="mBest">—</div>
      <div class="m-stat-lbl">Рекорд</div>
    </div>
    <div class="m-stat">
      <div class="m-stat-icon">🎮</div>
      <div class="m-stat-val" id="mGames">—</div>
      <div class="m-stat-lbl">Игр</div>
    </div>
    <div class="m-stat">
      <div class="m-stat-icon">🌌</div>
      <div class="m-stat-val" id="mZone">—</div>

    </div>
  </div>

  <button class="m-play-btn" onclick="startGame()">▶ Начать игру</button>

    <div id="lbList"><div class="m-lb-empty">Загрузка…</div></div>

</div>

<!-- ═══ GAME ═══ -->
<div class="screen hidden" id="gameScreen">
  <canvas id="gameCanvas"></canvas>
  <div class="g-hud">
    <div class="g-score-box">
      <div class="g-score-lbl">Высота</div>
      <div class="g-score-val" id="hScore">0</div>
    </div>
    <div class="g-zone-name" id="hZone">🌾 Рисовые поля</div>
    <div class="g-best-box">
      <div class="g-best-lbl">Рекорд</div>
      <div class="g-best-val" id="hBest">—</div>
    </div>
  </div>
  <button class="g-close-btn" onclick="goToMenu()">✕</button>
  <div class="g-touch">
    <div class="g-touch-half" id="tLeft"></div>
    <div class="g-touch-half" id="tRight"></div>
  </div>

</div>

<!-- ═══ GAME OVER ═══ -->
<div class="d-overlay" id="gameOverModal">
  <div class="d-modal">
    <div class="d-modal-emoji" id="moEmoji">🌾</div>
    <div class="d-modal-title" id="moTitle">Игра окончена</div>
    <div class="d-modal-row">Высота: <b id="moScore">0</b></div>
    <div class="d-modal-best" id="moBest"></div>
    <div class="d-modal-zone" id="moZone"></div>
    <div class="d-modal-btns">
      <button class="d-modal-btn secondary" onclick="goToMenu()">📊 Меню</button>
      <button class="d-modal-btn" onclick="startGame()">🔄 Ещё раз</button>
    </div>
  </div>
</div>

<div class="d-toast" id="toast"></div>

<script>
// ════════════════════════════════════════════
// SUPABASE
// ════════════════════════════════════════════
const SB_URL = 'https://heubrattlnikielnfheg.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhldWJyYXR0bG5pa2llbG5maGVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzYyMjcsImV4cCI6MjEwMDU1MjIyN30._lRs77YnsILFN_Ru4uR2wDWQFtAlazZh8UaaKa7fsnM';
const USE_SB = SB_URL.startsWith('http') && SB_KEY.length > 20;
let sb = null;
if (USE_SB) try { sb = supabase.createClient(SB_URL, SB_KEY); } catch(e){}

// ════════════════════════════════════════════
// IDENTITY
// ════════════════════════════════════════════
let playerId = null, playerName = 'Гость';

function resolvePlayer() {
  const p = new URLSearchParams(location.search);
  if (p.get('uid')) { playerId = p.get('uid'); playerName = p.get('name') || 'User'; return; }
  try {
    const tg = window.Telegram?.WebApp;
    const u  = tg?.initDataUnsafe?.user;
    if (u?.id) {
      playerId   = String(u.id);
      playerName = [u.first_name, u.last_name].filter(Boolean).join(' ').trim() || u.username || ('User '+u.id);
    }
  } catch(e){}
}

// ════════════════════════════════════════════
// DB LAYER
// ════════════════════════════════════════════
async function fetchStats() {
  if (!sb || !playerId) return { best:null, games:0 };
  try {
    const { data } = await sb.from('doodle_scores').select('score').eq('telegram_user_id', playerId).order('score',{ascending:false});
    if (!data?.length) return { best:null, games:0 };
    return { best: data[0].score, games: data.length };
  } catch(e){ return { best:null, games:0 }; }
}

async function saveScore(score, zone) {
  if (!sb || !playerId) return;
  try {
    await sb.from('doodle_scores').insert([{
      telegram_user_id: playerId, name: playerName,
      score, zone, played_at: new Date().toISOString()
    }]);
  } catch(e){ console.error(e); }
}

async function loadLeaderboard() {
  const el = document.getElementById('lbList');
  if (!sb) { el.innerHTML = '<div class="m-lb-empty">Локальный режим</div>'; return; }
  try {
    const { data } = await sb.from('doodle_scores').select('telegram_user_id,name,score').order('score',{ascending:false}).limit(60);
    if (!data?.length) { el.innerHTML = '<div class="m-lb-empty">Пока никто не играл ✨</div>'; return; }
    const map = new Map();
    data.forEach(r => { if (!map.has(r.telegram_user_id) || map.get(r.telegram_user_id).score < r.score) map.set(r.telegram_user_id, r); });
    const top = [...map.values()].sort((a,b)=>b.score-a.score).slice(0,10);
    const medals = ['🥇','🥈','🥉'];
    el.innerHTML = top.map((r,i)=>{
      const me = playerId && String(r.telegram_user_id)===String(playerId);
      return `<div class="m-lb-row ${me?'me':''}">
        <span class="m-lb-rank">${i+1}</span>
        <span class="m-lb-med">${medals[i]||''}</span>
        <span class="m-lb-name">${esc(r.name||'Игрок')}${me?' 👈':''}</span>
        <span class="m-lb-score">${r.score}</span>
      </div>`;
    }).join('');
  } catch(e){ el.innerHTML = '<div class="m-lb-empty">Ошибка</div>'; }
}

// ════════════════════════════════════════════
// ZONES — altitude thresholds (score units)
// ════════════════════════════════════════════
const ZONES = [
  { min:0,    name:'🌾 Рисовые поля', platColor:'#5a9e3a', platGlow:'rgba(90,158,58,0.5)',
    sky1:'#4a7c59', sky2:'#6aaa72', sky3:'#8fd49c' },
  { min:200,  name:'🏡 Деревня',     platColor:'#c0853a', platGlow:'rgba(192,133,58,0.5)',
    sky1:'#2d1e0e', sky2:'#5a3520', sky3:'#c4813d' },
  { min:500,  name:'🏙 Город',        platColor:'#3a7acd', platGlow:'rgba(58,122,205,0.5)',
    sky1:'#0a0a1a', sky2:'#0d1a35', sky3:'#1a3a6a' },
  { min:900,  name:'⛰ Горы',         platColor:'#8b9eb0', platGlow:'rgba(139,158,176,0.5)',
    sky1:'#080c14', sky2:'#0e1624', sky3:'#1a2a45' },
  { min:1400, name:'☁️ Облака',       platColor:'#e8e8f0', platGlow:'rgba(220,220,255,0.5)',
    sky1:'#060a18', sky2:'#0a1230', sky3:'#1530a0' },
  { min:2000, name:'🌌 Космос',       platColor:'#9b5de5', platGlow:'rgba(155,93,229,0.6)',
    sky1:'#000005', sky2:'#00000e', sky3:'#050520' },
];

function getZone(score) {
  let z = ZONES[0];
  for (const zone of ZONES) { if (score >= zone.min) z = zone; }
  return z;
}

// ════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function haptic(k){
  try{
    const tg=window.Telegram?.WebApp;
    if(!tg?.HapticFeedback) return;
    if(['success','error','warning'].includes(k)) tg.HapticFeedback.notificationOccurred(k);
    else tg.HapticFeedback.impactOccurred(k||'light');
  }catch(e){}
}
let _toastT;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove('show'),2500);
}

// ════════════════════════════════════════════
// SCREEN MANAGEMENT
// ════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
async function goToMenu(){
  stopGame();
  document.getElementById('gameOverModal').classList.remove('open');
  showScreen('menuScreen');
  await refreshMenu();
}
async function refreshMenu(){
  resolvePlayer();
  document.getElementById('mName').textContent = playerName;
  document.getElementById('mAvatar').textContent = playerId ? '🧑' : '🎮';
  document.getElementById('mSub').textContent = playerId ? `ID: ${playerId}` : 'Гость — счёт не сохраняется';
  const { best, games } = await fetchStats();
  document.getElementById('mBest').textContent  = best  !== null ? best  : '—';
  document.getElementById('mGames').textContent = games > 0      ? games : '—';
  document.getElementById('mZone').textContent  = best !== null ? getZone(best).name.split(' ')[0] : '—';
  document.getElementById('hBest').textContent  = best !== null ? best : '—';
  await loadLeaderboard();
}

// ════════════════════════════════════════════
// CANVAS & GAME STATE
// ════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// Physics — tuned for comfortable speed
const GRAVITY    = 0.28;   // slow, floaty
const JUMP_V     = -12.5;  // normal jump
const JUMP_BOOST = -16;    // bounce platform
const H_SPEED    = 3.8;
const PLAT_W     = 68;
const PLAT_H     = 13;
const PLAT_GAP   = 80;     // vertical spacing between platforms

let gs = {};
let raf = null;
let keys = {}, lPress = false, rPress = false;

// Score: ONLY increases when reaching a new max height — never for bouncing in place
let maxHeight = 0;

function resizeCanvas(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}

function initGame(){
  resizeCanvas();
  maxHeight = 0;

  gs = {
    score:    0,
    over:     false,
    maxCamY:  0,          // tracks highest camera position seen
    player: {
      x: canvas.width/2 - 16, y: 0,
      w: 32, h: 36,
      vy: 0, vx: 0
    },
    platforms:  [],
    particles:  [],
    stars:      [],
    cameraY:    0,
    prevZone:   null,
  };
  keys = {}; lPress = rPress = false;

  generateStars();
  buildInitialPlatforms();

  // Place player on the lowest platform
  const lowest = gs.platforms.reduce((a,b)=>a.y>b.y?a:b);
  gs.player.y = lowest.y - gs.player.h;
  gs.player.vy = JUMP_V;
  gs.cameraY = gs.player.y - canvas.height * 0.4;
  gs.maxCamY = gs.cameraY;
}

// ─── PLATFORMS ───────────────────────────────
function buildInitialPlatforms(){
  gs.platforms = [];
  let y = canvas.height - 60;
  const count = Math.ceil(canvas.height / PLAT_GAP) + 8;
  for (let i = 0; i < count; i++){
    gs.platforms.push(makePlat(y, i===0));
    y -= PLAT_GAP;
  }
}

function makePlat(y, forceNormal){
  const x    = 10 + Math.random() * (canvas.width - PLAT_W - 20);
  const type = (!forceNormal && Math.random() < 0.14) ? 'bounce' : 'normal';
  return { x, y, w: PLAT_W, h: PLAT_H, type };
}

function extendUp(){
  const highest = Math.min(...gs.platforms.map(p=>p.y));
  let y = highest;
  while (y > gs.cameraY - 300){
    y -= PLAT_GAP + (Math.random()*22 - 11);
    gs.platforms.push(makePlat(y));
  }
}

function pruneDown(){
  const cutoff = gs.cameraY + canvas.height + 300;
  gs.platforms = gs.platforms.filter(p => p.y < cutoff);
}

// ─── STARS ───────────────────────────────────
function generateStars(){
  gs.stars = [];
  for (let i=0; i<80; i++){
    gs.stars.push({
      wx: Math.random() * 2000,       // world x (0-2000 wide virtual)
      wy: Math.random() * 60000 - 55000, // world y range
      r:  Math.random()*1.4 + 0.3,
      a:  0.3 + Math.random()*0.7
    });
  }
}

// ─── BACKGROUND DRAWING ──────────────────────
// World Y = 0 is ground; negative = higher up
// cameraY in game coords (negative when high up)

function worldAlt(){ return -gs.cameraY; } // positive number = how high we are

function lerpColor(c1,c2,t){
  const h=(s)=>parseInt(s,16);
  const r1=h(c1.slice(1,3)),g1=h(c1.slice(3,5)),b1=h(c1.slice(5,7));
  const r2=h(c2.slice(1,3)),g2=h(c2.slice(3,5)),b2=h(c2.slice(5,7));
  const r=Math.round(r1+(r2-r1)*t),g=Math.round(g1+(g2-g1)*t),b=Math.round(b1+(b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

// sky gradient per score (altitude)
function drawSky(score){
  const zone = getZone(score);
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,   zone.sky1);
  grad.addColorStop(0.5, zone.sky2);
  grad.addColorStop(1,   zone.sky3);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// Draw twinkling stars (only visible above zone 2)
function drawStars(score){
  if (score < 400) return;
  const alpha = Math.min(1, (score-400)/400);
  const camY  = gs.cameraY;
  gs.stars.forEach(s=>{
    // parallax: stars move slower than world
    const sx = (s.wx / 2000) * canvas.width;
    const sy = s.wy - camY * 0.08;
    const screenY = sy % canvas.height;
    ctx.globalAlpha = alpha * s.a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(sx, (screenY + canvas.height) % canvas.height, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// Decorative layer: ground / village / city / mountains / etc.
function drawWorldDecor(score, camY){
  if (score < 30) {
    // Ground line with grass
    const groundScreenY = -camY + canvas.height * 0.1; // world y=0 on screen
    if (groundScreenY > 0 && groundScreenY < canvas.height){
      // earth
      ctx.fillStyle = '#3d6b2e';
      ctx.fillRect(0, groundScreenY, canvas.width, canvas.height - groundScreenY);
      // rice field lines
      ctx.strokeStyle = 'rgba(100,200,80,0.35)';
      ctx.lineWidth = 1;
      for(let i=0;i<6;i++){
        const fy = groundScreenY + 20 + i*18;
        if(fy < canvas.height){
          ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(canvas.width,fy); ctx.stroke();
        }
      }
    }
  }

  // Mist / atmosphere layers
  if (score >= 200 && score < 600) {
    // Warm village glow at bottom
    const grad = ctx.createLinearGradient(0, canvas.height*0.7, 0, canvas.height);
    grad.addColorStop(0, 'rgba(200,120,40,0)');
    grad.addColorStop(1, 'rgba(200,120,40,0.18)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, canvas.height*0.7, canvas.width, canvas.height*0.3);
  }
  if (score >= 500) {
    // City light glow at bottom
    const grad = ctx.createLinearGradient(0, canvas.height*0.65, 0, canvas.height);
    grad.addColorStop(0, 'rgba(40,80,200,0)');
    grad.addColorStop(1, 'rgba(40,80,200,0.2)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, canvas.height*0.65, canvas.width, canvas.height*0.35);
  }
  if (score >= 900) {
    // Mountain mist
    const grad = ctx.createLinearGradient(0, canvas.height*0.5, 0, canvas.height);
    grad.addColorStop(0, 'rgba(150,180,220,0)');
    grad.addColorStop(1, 'rgba(150,180,220,0.12)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, canvas.height*0.5, canvas.width, canvas.height*0.5);
  }

  // SILHOUETTES drawn at bottom of screen (parallax ~ 0.15)
  drawSilhouettes(score, camY);

  // Floating lanterns in village zone
  if (score >= 200 && score < 600) drawLanterns(score, camY);
  // Clouds
  if (score >= 300) drawClouds(score, camY);
  // Space planets
  if (score >= 1800) drawPlanets(score, camY);
}

// Pre-seeded silhouette data (so they don't regenerate)
let silhouetteSeed = [];
function initSilhouettes(){
  silhouetteSeed = [];
  for(let i=0;i<20;i++) silhouetteSeed.push({ x: Math.random(), h: 0.3+Math.random()*0.5, w: 0.06+Math.random()*0.1 });
}

function drawSilhouettes(score, camY){
  // World Y = large positive number for sky silhouettes at bottom
  const baseY = canvas.height; // screen bottom

  if (score < 200) {
    // Rice field trees / bamboo
    ctx.fillStyle = 'rgba(30,70,20,0.55)';
    silhouetteSeed.slice(0,10).forEach(s=>{
      const sx = s.x * canvas.width;
      const sh = 60 + s.h * 80;
      const sw = 6 + s.w * 10;
      // bamboo stalks
      ctx.fillRect(sx-sw/2, baseY-sh, sw, sh);
      // leaves at top
      ctx.beginPath();
      ctx.ellipse(sx, baseY-sh-10, sw*2.5, 18, 0, 0, Math.PI*2);
      ctx.fill();
    });
  }
  else if (score < 500) {
    // Village rooftops silhouette
    ctx.fillStyle = 'rgba(60,30,10,0.55)';
    silhouetteSeed.slice(0,8).forEach((s,i)=>{
      const sx = s.x * canvas.width;
      const sh = 50 + s.h * 70;
      const sw = 40 + s.w * canvas.width * 0.12;
      // building rect
      ctx.fillRect(sx-sw/2, baseY-sh, sw, sh);
      // curved Chinese roof
      ctx.beginPath();
      ctx.moveTo(sx-sw*0.7, baseY-sh);
      ctx.quadraticCurveTo(sx, baseY-sh-24, sx+sw*0.7, baseY-sh);
      ctx.closePath();
      ctx.fill();
    });
  }
  else if (score < 1000) {
    // City skyline
    ctx.fillStyle = 'rgba(10,20,50,0.7)';
    silhouetteSeed.forEach((s,i)=>{
      const sx = s.x * canvas.width;
      const sh = 80 + s.h * 180;
      const sw = 20 + s.w * canvas.width * 0.09;
      ctx.fillRect(sx-sw/2, baseY-sh, sw, sh);
      // antenna
      if(i%3===0){ ctx.fillRect(sx-1, baseY-sh-20, 2, 20); }
      // windows (random lights)
      ctx.fillStyle='rgba(255,220,100,0.35)';
      for(let wy=baseY-sh+6;wy<baseY-10;wy+=14){
        for(let wx=sx-sw/2+4;wx<sx+sw/2-4;wx+=10){
          if(Math.sin(wx*7.3+wy*3.1)>0.3) ctx.fillRect(wx,wy,5,8);
        }
      }
      ctx.fillStyle='rgba(10,20,50,0.7)';
    });
  }
  else if (score < 1500) {
    // Mountain peaks (ink-wash style)
    ctx.fillStyle = 'rgba(20,30,50,0.5)';
    silhouetteSeed.slice(0,7).forEach(s=>{
      const sx = s.x * canvas.width;
      const sh = 100 + s.h * 200;
      const sw = 80 + s.w * canvas.width * 0.3;
      ctx.beginPath();
      ctx.moveTo(sx-sw/2, baseY);
      ctx.lineTo(sx, baseY-sh);
      ctx.lineTo(sx+sw/2, baseY);
      ctx.closePath();
      ctx.fill();
      // snow cap
      ctx.fillStyle='rgba(200,215,240,0.5)';
      ctx.beginPath();
      ctx.moveTo(sx-sw*0.08, baseY-sh*0.82);
      ctx.lineTo(sx, baseY-sh);
      ctx.lineTo(sx+sw*0.08, baseY-sh*0.82);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle='rgba(20,30,50,0.5)';
    });
  }
}

// Lanterns
let lanternData = [];
function initLanterns(){
  lanternData=[];
  for(let i=0;i<8;i++) lanternData.push({ wx:Math.random()*1500, wy:-Math.random()*3000-200, phase:Math.random()*Math.PI*2 });
}
function drawLanterns(score, camY){
  const t = performance.now()/1000;
  lanternData.forEach(l=>{
    const sx = (l.wx/1500)*canvas.width;
    const sy = l.wy - camY + Math.sin(t*0.6+l.phase)*8;
    if(sy<-30||sy>canvas.height+30) return;
    ctx.shadowColor='rgba(255,150,50,0.7)'; ctx.shadowBlur=12;
    ctx.fillStyle='rgba(220,60,30,0.85)';
    ctx.beginPath();
    ctx.ellipse(sx, sy, 8, 12, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle='rgba(255,200,50,0.6)';
    ctx.beginPath();
    ctx.ellipse(sx, sy+2, 4, 7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0; ctx.shadowColor='transparent';
    // string
    ctx.strokeStyle='rgba(150,90,30,0.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx,sy-12); ctx.lineTo(sx,sy-22); ctx.stroke();
  });
}

// Clouds
let cloudData = [];
function initClouds(){
  cloudData=[];
  for(let i=0;i<12;i++) cloudData.push({
    wx: Math.random()*2000,
    wy: -(500+Math.random()*25000),
    w:  60+Math.random()*80,
    h:  20+Math.random()*25,
    a:  0.12+Math.random()*0.18
  });
}
function drawClouds(score, camY){
  if(score<300) return;
  const alpha = Math.min(1,(score-300)/300);
  cloudData.forEach(c=>{
    const sx = (c.wx/2000)*canvas.width;
    const sy = c.wy - camY*0.3; // parallax
    const screenY = ((sy % (canvas.height*3)) + canvas.height*3) % (canvas.height*3);
    if(screenY < -60 || screenY > canvas.height+60) return;
    ctx.globalAlpha = alpha * c.a;
    ctx.fillStyle = score>1200 ? '#7090c0' : '#ffffff';
    ctx.beginPath();
    ctx.ellipse(sx, screenY, c.w, c.h, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sx-c.w*0.35, screenY+c.h*0.15, c.w*0.6, c.h*0.7, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sx+c.w*0.35, screenY+c.h*0.15, c.w*0.55, c.h*0.65, 0, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}

// Planets (space zone)
let planetData = [];
function initPlanets(){
  planetData=[];
  const colors=[['#c0392b','#922b21'],['#2980b9','#1a5276'],['#f39c12','#d35400'],['#8e44ad','#6c3483'],['#1abc9c','#148f77']];
  for(let i=0;i<5;i++){
    const [c1,c2]=colors[i];
    planetData.push({ wx:Math.random()*1800, wy:-(22000+Math.random()*30000), r:20+Math.random()*35, c1,c2, rings:Math.random()>0.6 });
  }
}
function drawPlanets(score, camY){
  const alpha=Math.min(1,(score-1800)/600);
  planetData.forEach(p=>{
    const sx=(p.wx/1800)*canvas.width;
    const sy=p.wy - camY*0.02;
    if(sy<-100||sy>canvas.height+100) return;
    ctx.globalAlpha=alpha*0.8;
    const g=ctx.createRadialGradient(sx-p.r*0.3,sy-p.r*0.3,p.r*0.1,sx,sy,p.r);
    g.addColorStop(0,p.c1); g.addColorStop(1,p.c2);
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(sx,sy,p.r,0,Math.PI*2); ctx.fill();
    if(p.rings){
      ctx.strokeStyle=`rgba(255,220,150,0.3)`; ctx.lineWidth=p.r*0.25;
      ctx.beginPath(); ctx.ellipse(sx,sy,p.r*1.6,p.r*0.35,-0.4,0,Math.PI*2); ctx.stroke();
    }
    ctx.globalAlpha=1;
  });
}

// ─── PLATFORMS DRAWING ───────────────────────
function drawPlatforms(){
  const zone = getZone(gs.score);
  gs.platforms.forEach(p=>{
    const sy = p.y - gs.cameraY;
    if(sy < -20 || sy > canvas.height+20) return;

    const isBounce = p.type==='bounce';
    const color = isBounce ? '#ff6b6b' : zone.platColor;
    const glow  = isBounce ? 'rgba(255,107,107,0.6)' : zone.platGlow;

    ctx.shadowColor=glow; ctx.shadowBlur=8;
    ctx.fillStyle=color;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(p.x, sy, p.w, p.h, 5);
    else { ctx.rect(p.x, sy, p.w, p.h); }
    ctx.fill();
    ctx.shadowBlur=0; ctx.shadowColor='transparent';

    // shine
    ctx.fillStyle='rgba(255,255,255,0.22)';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(p.x+4, sy+2, p.w-8, 4, 2);
    else ctx.rect(p.x+4, sy+2, p.w-8, 4);
    ctx.fill();

    // bounce marker
    if(isBounce){
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.font='bold 10px Inter';
      ctx.textAlign='center';
      ctx.fillText('⬆', p.x+p.w/2, sy+9);
    }
  });
}

// ─── PLAYER DRAWING ──────────────────────────
function drawPlayer(){
  const p  = gs.player;
  const cx = p.x + p.w/2;
  const cy = (p.y - gs.cameraY) + p.h/2;

  if(cy < -80 || cy > canvas.height+80) return;

  // shadow
  ctx.globalAlpha=0.2;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(cx, cy+p.h/2+5, 13, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  // body
  ctx.fillStyle='#F5CBA7';
  ctx.beginPath();
  ctx.ellipse(cx, cy+3, 14, 16, 0, 0, Math.PI*2);
  ctx.fill();

  // shorts
  ctx.fillStyle='#2980B9';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(cx-12, cy+8, 24, 12, 3);
  else ctx.rect(cx-12, cy+8, 24, 12);
  ctx.fill();

  // shirt
  ctx.fillStyle='#E74C3C';
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(cx-12, cy-6, 24, 16, 3);
  else ctx.rect(cx-12, cy-6, 24, 16);
  ctx.fill();

  // head
  ctx.fillStyle='#F5CBA7';
  ctx.beginPath();
  ctx.arc(cx, cy-15, 11, 0, Math.PI*2);
  ctx.fill();

  // hair
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath();
  ctx.arc(cx, cy-22, 8, Math.PI, Math.PI*2);
  ctx.fill();

  // eyes
  ctx.fillStyle='#2C3E50';
  ctx.beginPath(); ctx.arc(cx-4, cy-16, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+4, cy-16, 2.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(cx-3, cy-16.5, 0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+5, cy-16.5, 0.8, 0, Math.PI*2); ctx.fill();

  // smile
  ctx.strokeStyle='#2C3E50'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx, cy-12, 4, 0.1, Math.PI-0.1); ctx.stroke();
}

// ─── PARTICLES ───────────────────────────────
function drawParticles(){
  gs.particles.forEach(pt=>{
    const sy = pt.y - gs.cameraY;
    ctx.globalAlpha = pt.life/pt.maxLife;
    ctx.fillStyle   = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, sy, 3, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}

function burst(x, y, color){
  for(let i=0;i<7;i++){
    gs.particles.push({
      x, y,
      vx:(Math.random()-0.5)*6,
      vy:(Math.random()-0.5)*5-1,
      life:24, maxLife:24,
      color: color||`hsl(${40+Math.random()*40},100%,60%)`
    });
  }
}

// ═══ UPDATE ══════════════════════════════════
function update(){
  const p = gs.player;

  // Horizontal movement
  const goL = keys['ArrowLeft']||keys['a']||lPress;
  const goR = keys['ArrowRight']||keys['d']||rPress;
  if(goL)      p.vx = -H_SPEED;
  else if(goR) p.vx =  H_SPEED;
  else         p.vx *= 0.78;
  p.x += p.vx;
  if(p.x+p.w < 0)      p.x = canvas.width;
  if(p.x > canvas.width) p.x = -p.w;

  // Gravity
  p.vy += GRAVITY;
  p.y  += p.vy;

  // Platform collision — only while falling
  if(p.vy > 0){
    const footX = p.x + p.w/2;
    const footY = p.y + p.h;
    const prevFY = footY - p.vy;
    gs.platforms.forEach(pl=>{
      if(
        footX >= pl.x && footX <= pl.x+pl.w &&
        prevFY <= pl.y+pl.h &&
        footY  >= pl.y &&
        footY  <= pl.y+pl.h+10
      ){
        if(pl.type==='bounce'){
          p.vy = JUMP_BOOST;
          burst(footX, pl.y, '#ff6b6b');
          haptic('success');
        } else {
          p.vy = JUMP_V;
          burst(footX, pl.y, null);
          haptic('light');
        }
      }
    });
  }

  // Camera: only moves UP, never down (camera locks to highest point reached)
  const targetCamY = p.y - canvas.height * 0.38;
  if(targetCamY < gs.cameraY){
    gs.cameraY = targetCamY;
  }

  // ── SCORE: only count new maximum height ──
  // World Y=0 is ground level (player starts at canvas.height - ~150)
  // cameraY is negative when high up
  // Height in "units" = how far above start the camera has gone
  const startCamY = canvas.height * 0.5;       // approximate starting camY
  const heightUnits = Math.max(0, Math.floor((startCamY - gs.cameraY) / 12));
  if(heightUnits > gs.score){
    gs.score = heightUnits;
  }
  // gs.score NEVER decreases — no bouncing-in-place exploit

  // Extend / prune platforms
  extendUp();
  pruneDown();

  // Particles
  gs.particles.forEach(pt=>{ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.15; pt.life--; });
  gs.particles = gs.particles.filter(pt=>pt.life>0);

  // Zone change announcement
  const zone = getZone(gs.score);
  if(zone !== gs.prevZone && gs.prevZone !== null){
    showToast(zone.name);
    haptic('warning');
  }
  gs.prevZone = zone;

  // HUD updates
  document.getElementById('hScore').textContent = gs.score;
  const hud = document.getElementById('hZone');
  hud.textContent = zone.name;
  hud.style.background = zone.platColor+'33';
  hud.style.color = '#fff';
  hud.style.border = `1px solid ${zone.platColor}55`;

  // Death check
  if(p.y - gs.cameraY > canvas.height + 100){
    gs.over = true;
  }
}

// ═══ RENDER ══════════════════════════════════
function render(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawSky(gs.score);
  drawStars(gs.score);
  drawWorldDecor(gs.score, gs.cameraY);
  drawPlatforms();
  drawParticles();
  drawPlayer();
}

// ═══ GAME LOOP ═══════════════════════════════
function loop(){
  if(gs.over){ render(); onGameOver(); return; }
  update();
  render();
  raf = requestAnimationFrame(loop);
}

function stopGame(){
  if(raf){ cancelAnimationFrame(raf); raf=null; }
}

async function onGameOver(){
  stopGame();
  haptic('error');

  const score = gs.score;
  const zone  = getZone(score);

  const { best: prevBest } = await fetchStats();
  await saveScore(score, zone.name);

  document.getElementById('moEmoji').textContent  = score>500?'🌟':(score>200?'🏮':'🌾');
  document.getElementById('moTitle').textContent  = score>800?'Невероятно!':(score>300?'Отличный прыжок!':'Попробуй ещё раз');
  document.getElementById('moScore').textContent  = score;
  document.getElementById('moZone').textContent   = `Достиг: ${zone.name}`;

  const bestEl = document.getElementById('moBest');
  if(!playerId){
    bestEl.textContent='👻 Войди через Telegram для рейтинга';
  } else if(prevBest===null || score>prevBest){
    bestEl.textContent='🏆 Новый личный рекорд!';
    haptic('success');
    document.getElementById('hBest').textContent = score;
  } else {
    bestEl.textContent=`Твой рекорд: ${prevBest}`;
  }

  document.getElementById('gameOverModal').classList.add('open');
}

// ═══ START ═══════════════════════════════════
function startGame(){
  document.getElementById('gameOverModal').classList.remove('open');
  showScreen('gameScreen');
  stopGame();
  initGame();
  // re-show touch hint
  const hint = document.getElementById('touchHint');
  hint.style.animation='none';
  void hint.offsetWidth;
  hint.style.animation='fadeHint 3s forwards';
  loop();
}

// ═══ INPUT ═══════════════════════════════════
window.addEventListener('keydown', e=>{ keys[e.key]=true; });
window.addEventListener('keyup',   e=>{ keys[e.key]=false; });

const tL = document.getElementById('tLeft');
const tR = document.getElementById('tRight');
tL.addEventListener('touchstart', e=>{ e.preventDefault(); lPress=true;  },{passive:false});
tL.addEventListener('touchend',   e=>{ e.preventDefault(); lPress=false; },{passive:false});
tL.addEventListener('touchcancel',()=>{ lPress=false; });
tR.addEventListener('touchstart', e=>{ e.preventDefault(); rPress=true;  },{passive:false});
tR.addEventListener('touchend',   e=>{ e.preventDefault(); rPress=false; },{passive:false});
tR.addEventListener('touchcancel',()=>{ rPress=false; });

window.addEventListener('resize', ()=>{
  if(!document.getElementById('gameScreen').classList.contains('hidden')) resizeCanvas();
});

// ═══ BOOT ════════════════════════════════════
(async function boot(){
  resolvePlayer();
  // pre-init decorations
  initSilhouettes();
  initLanterns();
  initClouds();
  initPlanets();
  if(window.Telegram?.WebApp) try{ window.Telegram.WebApp.ready(); }catch(e){}
  showScreen('menuScreen');
  await refreshMenu();
})();
</script>
